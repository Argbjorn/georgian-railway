title: Georgian Railway Map

baseURL: https://georailway.com

defaultContentLanguage: en
# params.images: the default share-preview image (og:image) of the language, used by pages without
# their own (routes and stations set theirs). Drawn by scripts/make_share_images.py.
languages:
  en:
    languageName: English
    weight: 1
    params:
      images: [/images/share/home-en.png]
  ru:
    languageName: Русский
    weight: 3
    params:
      images: [/images/share/home-ru.png]
  ka:
    languageName: ქართული
    weight: 2
    params:
      images: [/images/share/home-ka.png]

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

# hugo server only: JS modules and sidebar.css are linked without versions, so without this a phone
# keeps old modules and mixes them with new ones between local builds. Production (GitHub Pages)
# sends max-age=600 itself.
server:
  headers:
    - for: /**
      values:
        Cache-Control: no-store

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - identifier: routes
      name: Routes
      pageRef: /routes
      weight: 2
    - identifier: stations
      name: Stations
      pageRef: /stations
      weight: 3
    - identifier: about
      name: About
      pageRef: /about
      weight: 6
    - name: Language
      weight: 7
      params:
        type: language-switch
        label: true
        icon: "translate"

params:
  # og:site_name (Hextra reads params.title, not the top-level title)
  title: Georgian Railway Map
  description: Georgia's train routes on the map and the up-to-date schedule.
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.svg
      link: /
      width: 32
      height: 32
    width: normal
  page:
    width: normal
  theme:
    displayToggle: false
    default: light
  editURL:
    enable: false

  search:
    enable: false

services:
  googleAnalytics:
    ID: G-9K8Z2VBPQJ