{{ define "main" }}
<div class="content-max-width" style="display: flex;">
  {{ partial "sidebar.html" (dict
        "context" .
        "disableSidebar" true
        "displayPlaceholder" false
    ) }}
  <div style="min-width: 0; flex: 1; padding: 2rem 1.5rem;">
  <div class="content-narrow">
    <article class="hx:w-full">
      <div class="content">
        {{ if .Title }}<h1>{{ .Title }}</h1>{{ end }}
        {{ .Content }}
      </div>
      {{ $pages := .Pages }}

      <ul class="link-list hx:mt-8 not-prose">
        {{ range $pages }}
          <li>
            <a class="link-list-item" href="{{ .Permalink }}">
              <span class="link-list-text">{{ .Title }}</span>
            </a>
          </li>
        {{ end }}
      </ul>
    </article>
  </div>
  </div>
</div>

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "item": "{{ urls.AbsLangURL "directions" }}",
        "name": {{ i18n "directions" | jsonify }},
        "url": "{{ urls.AbsLangURL "directions" }}"
      }
    ]
  }
</script>
{{ end }}
