{{ $coords := .coords }}
{{ $lat := index $coords 0 }}
{{ $lng := index $coords 1 }}

<div class="route-map-container">
    <div id="station-map" data-station-lat="{{ $lat }}" data-station-lng="{{ $lng }}" class="route-map-container">
        {{ partial "map-expand-controls.html" . }}
    </div>
</div>

<script type="module">
    import SimpleStationMap from '/js/components/map/SimpleStationMap.js';
    import { makeMapExpandable } from '/js/components/map/expandableMap.js';

    const mapContainer = document.getElementById('station-map');
    const map = new SimpleStationMap('station-map', [
        parseFloat(mapContainer.dataset.stationLat),
        parseFloat(mapContainer.dataset.stationLng),
    ]);
    map.initialize();
    makeMapExpandable(mapContainer, map.map);
</script>
