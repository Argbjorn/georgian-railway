<div class="route-map-container">
    <div id="route-map" data-route-ref="{{ .Params.ref }}" class="route-map-container">
        {{ partial "map-expand-controls.html" . }}
    </div>
</div>

<script type="module">
    import SimpleRouteMap from '/js/components/map/SimpleRouteMap.js';
    import { makeMapExpandable } from '/js/components/map/expandableMap.js';

    const mapContainer = document.getElementById('route-map');
    const map = new SimpleRouteMap('route-map', mapContainer.dataset.routeRef);
    map.initialize();
    makeMapExpandable(mapContainer, map.map);
</script>
